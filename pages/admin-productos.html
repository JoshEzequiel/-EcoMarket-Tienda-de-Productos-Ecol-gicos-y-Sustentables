<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Administrar Productos - EcoMarket</title>

    <link rel="stylesheet" href="../css/style.css">
    <link rel="icon" href="../assets/img/eco.png" type="image/png">
</head>

<body>

    <!-- ============================================
         HEADER
         ============================================ -->

    <header>

        <a href="admin.html" class="logo-container">
            <img src="../assets/img/eco.png" alt="EcoMarket Logo" class="logo">
            <span class="brand">EcoMarket</span>
        </a>

        <nav>
            <ul>
                <li><a href="admin.html" id="linkInicioAdmin">Inicio Admin</a></li>
                <li><a href="home.html">Volver a la tienda</a></li>
            </ul>
        </nav>

    </header>


    <!-- ============================================
         ADMINISTRACION DE PRODUCTOS
         ============================================ -->

    <main class="admin-main">

        <div class="admin-titulo">

            <div>
                <h1>Productos</h1>
                <p>Listado de productos registrados en EcoMarket.</p>
            </div>

            <a href="admin-nuevo-producto.html" class="btn-admin" id="btnNuevoProducto">
                Nuevo producto
            </a>

        </div>


        <!-- TABLA DE PRODUCTOS -->

        <section class="tabla-container">

            <table class="tabla-admin">

                <thead>
                    <tr>
                        <th>Codigo</th>
                        <th>Nombre</th>
                        <th>Precio</th>
                        <th>Stock</th>
                        <th>Categoria</th>
                        <th>Acciones</th>
                    </tr>
                </thead>

                <tbody id="listaProductos">

                    <!-- Los productos se cargaran con JavaScript -->

                </tbody>

            </table>

        </section>

    </main>


    <!-- ============================================
         FOOTER
         ============================================ -->

    <footer>

        <div class="footer-content">

            <div>
                <h4>EcoMarket</h4>
                <p>Administracion de productos.</p>
            </div>

            <div>
                <h4>Contacto</h4>
                <p>contacto@ecomarket.cl</p>
            </div>

        </div>

        <p class="copyright">
            © 2026 EcoMarket
        </p>

    </footer>


    <!-- ============================================
         SCRIPTS
         ============================================ -->

    <script src="../js/permisos.js"></script>
    <script src="../js/productos-data.js"></script>
    <script src="../js/admin-productos.js"></script>

</body>

</html>
