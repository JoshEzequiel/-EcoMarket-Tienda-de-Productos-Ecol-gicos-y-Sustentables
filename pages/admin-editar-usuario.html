<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Editar Usuario - EcoMarket</title>

    <link rel="stylesheet" href="../css/style.css">
    <link rel="icon" href="../assets/img/eco.png" type="image/png">
</head>

<body>

    <!-- ============================================
         HEADER
         ============================================ -->

    <header>

        <a href="admin.html" class="logo-container">
            <img src="../assets/img/eco.png" alt="EcoMarket Logo" class="logo">
            <span class="brand">EcoMarket</span>
        </a>

        <nav>
            <ul>
                <li><a href="admin.html">Inicio Admin</a></li>
                <li><a href="admin-usuarios.html">Usuarios</a></li>
                <li><a href="home.html">Volver a la tienda</a></li>
            </ul>
        </nav>

    </header>


    <!-- ============================================
         EDITAR USUARIO
         ============================================ -->

    <main class="admin-main">

        <h1>Editar Usuario</h1>

        <p>
            Modifica los datos del usuario seleccionado.
        </p>


        <form id="editarUsuarioForm" class="form-admin" novalidate>


            <!-- RUN -->
            <div class="form-group">

                <label for="run">
                    RUN *
                </label>

                <input
                    type="text"
                    id="run"
                    name="run"
                    maxlength="9"
                    required
                >

                <span class="error-msg" id="runError"></span>

            </div>


            <!-- NOMBRE Y APELLIDOS -->
            <div class="form-row">

                <div class="form-group">

                    <label for="nombre">
                        Nombre *
                    </label>

                    <input
                        type="text"
                        id="nombre"
                        name="nombre"
                        maxlength="50"
                        required
                    >

                    <span class="error-msg" id="nombreError"></span>

                </div>


                <div class="form-group">

                    <label for="apellido">
                        Apellidos *
                    </label>

                    <input
                        type="text"
                        id="apellido"
                        name="apellido"
                        maxlength="100"
                        required
                    >

                    <span class="error-msg" id="apellidoError"></span>

                </div>

            </div>


            <!-- CORREO -->
            <div class="form-group">

                <label for="email">
                    Correo *
                </label>

                <input
                    type="email"
                    id="email"
                    name="email"
                    maxlength="100"
                    required
                >

                <span class="error-msg" id="emailError"></span>

            </div>


            <!-- FECHA NACIMIENTO -->
            <div class="form-group">

                <label for="fechaNacimiento">
                    Fecha de nacimiento
                </label>

                <input
                    type="date"
                    id="fechaNacimiento"
                    name="fechaNacimiento"
                >

            </div>


            <!-- TIPO DE USUARIO -->
            <div class="form-group">

                <label for="tipoUsuario">
                    Tipo de Usuario *
                </label>

                <select
                    id="tipoUsuario"
                    name="tipoUsuario"
                    required
                >

                    <option value="">
                        Seleccione un tipo
                    </option>

                    <option value="Administrador">
                        Administrador
                    </option>

                    <option value="Vendedor">
                        Vendedor
                    </option>

                    <option value="Cliente">
                        Cliente
                    </option>

                </select>

                <span class="error-msg" id="tipoUsuarioError"></span>

            </div>


            <!-- REGION Y COMUNA -->
            <div class="form-row">

                <div class="form-group">

                    <label for="region">
                        Region *
                    </label>

                    <select
                        id="region"
                        name="region"
                        required
                    >

                        <option value="">
                            Seleccione region
                        </option>

                        <option value="metropolitana">
                            Region Metropolitana
                        </option>

                        <option value="valparaiso">
                            Valparaiso
                        </option>

                        <option value="biobio">
                            Biobio
                        </option>

                    </select>

                    <span class="error-msg" id="regionError"></span>

                </div>


                <div class="form-group">

                    <label for="comuna">
                        Comuna *
                    </label>

                    <select
                        id="comuna"
                        name="comuna"
                        required
                    >

                        <option value="">
                            Seleccione comuna
                        </option>

                    </select>

                    <span class="error-msg" id="comunaError"></span>

                </div>

            </div>


            <!-- DIRECCION -->
            <div class="form-group">

                <label for="direccion">
                    Direccion *
                </label>

                <input
                    type="text"
                    id="direccion"
                    name="direccion"
                    maxlength="300"
                    required
                >

                <span class="error-msg" id="direccionError"></span>

            </div>


            <!-- CONTRASENA -->
            <div class="form-group">

                <label for="password">
                    Contrasena *
                </label>

                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Entre 4 y 10 caracteres"
                    required
                >

                <span class="error-msg" id="passwordError"></span>

            </div>


            <!-- BOTONES -->
            <div class="form-botones">

                <button
                    type="submit"
                    class="btn-admin"
                >
                    Guardar cambios
                </button>

                <a
                    href="admin-usuarios.html"
                    class="btn-cancelar"
                >
                    Cancelar
                </a>

            </div>

        </form>

    </main>


    <!-- ============================================
         FOOTER
         ============================================ -->

    <footer>

        <div class="footer-content">

            <div>
                <h4>EcoMarket</h4>
                <p>Administracion de usuarios.</p>
            </div>

            <div>
                <h4>Contacto</h4>
                <p>contacto@ecomarket.cl</p>
            </div>

        </div>

        <p class="copyright">
            © 2026 EcoMarket
        </p>

    </footer>


    <!-- ============================================
         SCRIPT
         ============================================ -->


    <script src="../js/permisos.js"></script>
    <script src="../js/admin-editar-usuario.js"></script>

</body>

</html>
