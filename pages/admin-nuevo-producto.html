<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Nuevo Producto - EcoMarket</title>

    <link rel="stylesheet" href="../css/style.css">
    <link rel="icon" href="../assets/img/eco.png" type="image/png">
</head>

<body>

    <!-- ============================================
         HEADER
         ============================================ -->

    <header>

        <a href="admin.html" class="logo-container">
            <img src="../assets/img/eco.png" alt="EcoMarket Logo" class="logo">
            <span class="brand">EcoMarket</span>
        </a>

        <nav>
            <ul>
                <li><a href="admin.html">Inicio Admin</a></li>
                <li><a href="admin-productos.html">Productos</a></li>
                <li><a href="home.html">Volver a la tienda</a></li>
            </ul>
        </nav>

    </header>


    <!-- ============================================
         NUEVO PRODUCTO
         ============================================ -->

    <main class="admin-main">

        <h1>Nuevo Producto</h1>

        <p>
            Completa los datos para agregar un producto a EcoMarket.
        </p>


        <!-- FORMULARIO -->

        <form id="productoForm" class="form-admin" novalidate>


            <!-- CODIGO -->
            <div class="form-group">

                <label for="codigo">
                    Codigo del producto *
                </label>

                <input
                    type="text"
                    id="codigo"
                    name="codigo"
                    placeholder="Ej: ECO005"
                    minlength="3"
                    required
                >

                <span class="error-msg" id="codigoError"></span>

            </div>


            <!-- NOMBRE -->
            <div class="form-group">

                <label for="nombreProducto">
                    Nombre *
                </label>

                <input
                    type="text"
                    id="nombreProducto"
                    name="nombreProducto"
                    placeholder="Nombre del producto"
                    maxlength="100"
                    required
                >

                <span class="error-msg" id="nombreProductoError"></span>

            </div>


            <!-- DESCRIPCION -->
            <div class="form-group">

                <label for="descripcion">
                    Descripcion
                </label>

                <textarea
                    id="descripcion"
                    name="descripcion"
                    rows="4"
                    placeholder="Descripcion del producto"
                    maxlength="500"
                ></textarea>

                <span class="error-msg" id="descripcionError"></span>

            </div>


            <!-- PRECIO -->
            <div class="form-group">

                <label for="precio">
                    Precio *
                </label>

                <input
                    type="number"
                    id="precio"
                    name="precio"
                    placeholder="Ej: 12990"
                    min="0"
                    step="0.01"
                    required
                >

                <span class="error-msg" id="precioError"></span>

            </div>


            <!-- STOCK Y STOCK CRITICO -->
            <div class="form-row">

                <div class="form-group">

                    <label for="stock">
                        Stock *
                    </label>

                    <input
                        type="number"
                        id="stock"
                        name="stock"
                        placeholder="Ej: 10"
                        min="0"
                        step="1"
                        required
                    >

                    <span class="error-msg" id="stockError"></span>

                </div>


                <div class="form-group">

                    <label for="stockCritico">
                        Stock critico
                    </label>

                    <input
                        type="number"
                        id="stockCritico"
                        name="stockCritico"
                        placeholder="Ej: 3"
                        min="0"
                        step="1"
                    >

                    <span class="error-msg" id="stockCriticoError"></span>

                </div>

            </div>


            <!-- CATEGORIA -->
            <div class="form-group">

                <label for="categoria">
                    Categoria *
                </label>

                <select
                    id="categoria"
                    name="categoria"
                    required
                >

                    <option value="">
                        Seleccione una categoria
                    </option>

                    <option value="cuidado">
                        Cuidado Personal
                    </option>

                    <option value="alimentos">
                        Alimentos Organicos
                    </option>

                    <option value="vestimenta">
                        Vestimenta Sustentable
                    </option>

                    <option value="tecnologia">
                        Tecnologia Eco
                    </option>

                </select>

                <span class="error-msg" id="categoriaError"></span>

            </div>


            <!-- IMAGEN -->
            <div class="form-group">

                <label for="imagen">
                    Imagen
                </label>

                <input
                    type="text"
                    id="imagen"
                    name="imagen"
                    placeholder="../assets/img/producto5.png"
                >

                <small>
                    Campo opcional.
                </small>

            </div>


            <!-- BOTONES -->
            <div class="form-botones">

                <button
                    type="submit"
                    class="btn-admin"
                    id="btnGuardarProducto"
                >
                    Guardar producto
                </button>

                <a
                    href="admin-productos.html"
                    class="btn-cancelar"
                >
                    Cancelar
                </a>

            </div>

        </form>

    </main>


    <!-- ============================================
         FOOTER
         ============================================ -->

    <footer>

        <div class="footer-content">

            <div>
                <h4>EcoMarket</h4>
                <p>Administracion de productos.</p>
            </div>

            <div>
                <h4>Contacto</h4>
                <p>contacto@ecomarket.cl</p>
            </div>

        </div>

        <p class="copyright">
            © 2026 EcoMarket
        </p>

    </footer>


    <!-- ============================================
         SCRIPT
         ============================================ -->


    <script src="../js/permisos.js"></script>
    <script src="../js/admin-nuevo-producto.js"></script>

</body>

</html>
