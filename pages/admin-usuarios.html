<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Administrar Usuarios - EcoMarket</title>

    <link rel="stylesheet" href="../css/style.css">
    <link rel="icon" href="../assets/img/eco.png" type="image/png">
</head>

<body>

    <!-- ============================================
         HEADER
         ============================================ -->

    <header>

        <a href="admin.html" class="logo-container">
            <img src="../assets/img/eco.png" alt="EcoMarket Logo" class="logo">
            <span class="brand">EcoMarket</span>
        </a>

        <nav>
            <ul>
                <li><a href="admin.html">Inicio Admin</a></li>
                <li><a href="admin-productos.html">Productos</a></li>
                <li><a href="home.html">Volver a la tienda</a></li>
            </ul>
        </nav>

    </header>


    <!-- ============================================
         ADMINISTRACION DE USUARIOS
         ============================================ -->

    <main class="admin-main">

        <div class="admin-titulo">

            <div>
                <h1>Usuarios</h1>
                <p>Listado de usuarios registrados en EcoMarket.</p>
            </div>

            <a href="admin-nuevo-usuario.html" class="btn-admin">
                Nuevo usuario
            </a>

        </div>


        <!-- TABLA DE USUARIOS -->

        <section class="tabla-container">

            <table class="tabla-admin">

                <thead>

                    <tr>
                        <th>RUN</th>
                        <th>Nombre</th>
                        <th>Correo</th>
                        <th>Region</th>
                        <th>Tipo Usuario</th>
                        <th>Acciones</th>
                    </tr>

                </thead>


                <tbody id="listaUsuarios">

                    <!-- Los usuarios se cargaran con JavaScript -->

                </tbody>

            </table>

        </section>

    </main>


    <!-- ============================================
         FOOTER
         ============================================ -->

    <footer>

        <div class="footer-content">

            <div>
                <h4>EcoMarket</h4>
                <p>Administracion de usuarios.</p>
            </div>

            <div>
                <h4>Contacto</h4>
                <p>contacto@ecomarket.cl</p>
            </div>

        </div>

        <p class="copyright">
            © 2026 EcoMarket
        </p>

    </footer>


    <!-- ============================================
         SCRIPT
         ============================================ -->


    <script src="../js/permisos.js"></script>
    <script src="../js/admin-usuarios.js"></script>

</body>

</html>
